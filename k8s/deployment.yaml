apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  labels: {app: flask-app}
spec:
  replicas: 2
  selector:
    matchLabels: {app: flask-app}
  template:
    metadata:
      labels: {app: flask-app}
    spec:
      containers:
        - name: flask-app
          image: anupamaajith/flask-cicd:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet: {path: /health, port: 5000}
          livenessProbe:
            httpGet: {path: /health, port: 5000}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
